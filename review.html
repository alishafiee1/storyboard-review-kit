<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>بازبینی و ویرایش</title><link rel="stylesheet" href="tools/ui/review.css"></head><body>
<header id="bar">
 <div class="bs"><button id="menuBtn" class="ib" type="button" aria-label="منو" aria-haspopup="dialog" aria-expanded="false" data-ic="menu"></button>
  <div class="ttl"><h1 id="title">بازبینی</h1><span id="ep"></span></div></div>
 <div id="gstat"><span id="gst"></span><span class="gbar"><i></i></span><span id="gpct"></span></div>
 <nav id="nav" dir="ltr" aria-label="تصویر قبلی و بعدی"><button id="navPrev" class="ib" type="button" aria-label="تصویر قبلی" title="تصویر قبلی (←)" data-ic="chevL"></button><span id="pos">۰ / ۰</span><button id="navNext" class="ib" type="button" aria-label="تصویر بعدی" title="تصویر بعدی (→)" data-ic="chevR"></button>
  <input id="prog" type="range" min="0" max="0" value="0" aria-label="پرش به تصویر"><span id="apr" dir="rtl"></span></nav>
 <div class="be">
  <button id="jobPill" class="jobpill" type="button" title="وضعیت ساخت صدا" hidden></button>
  <button id="fltChip" class="fltchip" type="button" title="پاک کردن فیلتر" hidden></button>
  <input id="gq" type="search" aria-label="جست‌وجوی تصویر" placeholder="شناسه یا متن…" autocomplete="off" hidden>
  <button id="gSearch" class="ib gonly" type="button" aria-label="جست‌وجو" title="جست‌وجو" data-ic="search"></button>
  <button id="gFilter" class="ib gonly" type="button" aria-label="فیلتر" title="فیلتر" data-ic="sliders"></button>
  <button id="galBtn" class="ib" type="button" aria-label="گالری تصویرها" title="گالری تصویرها" data-ic="grid"></button>
  <button id="bookPill" class="pill" type="button" aria-label="منبع: داستان یا رفرنس‌ها" title="داستان | رفرنس‌ها" aria-pressed="false"><span data-b="story">داستان</span> | <span data-b="refs">رفرنس‌ها</span></button>
  <button id="lang" class="pill" type="button" dir="ltr" aria-label="زبان متن و صدا" title="روشن = متن انگلیسی دیده شود و صدا انگلیسی پخش شود؛ خاموش = فقط فارسی"><span data-l="fa">فا</span> / <span data-l="en">EN</span></button>
  <input type="checkbox" id="showEN" hidden>
  <button id="bUndo" class="ib" type="button" aria-label="برگردان آخرین تغییر" title="برگردان آخرین تغییر ساختاری (Ctrl+Z)" data-ic="undo" disabled></button>
 </div>
</header>
<main id="gallery" hidden></main>
<main id="list"></main>
<footer id="foot">
 <div class="ftp" dir="ltr"><button id="prev" class="ib" type="button" aria-label="تصویر قبلی" data-ic="skipPrev"></button><button id="play" class="playb" type="button" aria-label="پخش خودکار" title="پخش خودکار (Space)"><span class="pi" data-ic="play"></span><span class="pp" data-ic="pause"></span></button><button id="next" class="ib" type="button" aria-label="تصویر بعدی" data-ic="skipNext"></button><button id="playS" class="ib monly" type="button" data-fwd="play" aria-label="پخش خودکار" data-ic="play"></button>
  <span id="ttime" dir="ltr">۰:۰۰ / ۰:۰۰</span><span class="spdc" dir="ltr"><button class="spdb spdm" type="button" data-spd="dec" aria-label="کاهش سرعت پخش" title="کاهش سرعت پخش">−</button><button class="spdl" type="button" data-spd="reset" aria-label="تنظیم سرعت پخش به ۱" title="سرعت پخش (کلیک برای بازنشانی به ۱)">۱×</button><button class="spdb spdp" type="button" data-spd="inc" aria-label="افزایش سرعت پخش" title="افزایش سرعت پخش">+</button></span><span id="tbar" aria-label="نوار پیشرفت صدا"><i style="width:0%"></i></span></div>
 <div class="mact monly"><button class="ib" type="button" data-fwd="bNote" aria-label="یادداشت و ادیت" data-ic="pencil"></button><button class="ib" type="button" data-fwd="bPrompt" aria-label="پرامپت تصویر" data-ic="image"></button><button class="ib" type="button" data-fwd="bVprompt" aria-label="پرامپت ویدیو" data-ic="clapper"></button><button class="ib" type="button" data-fwd="bFlag" aria-label="نشانه‌گذاری مشکل" data-ic="flag"></button><span class="spdc" dir="ltr"><button class="spdb spdm" type="button" data-spd="dec" aria-label="کاهش سرعت پخش" title="کاهش سرعت پخش">−</button><button class="spdl" type="button" data-spd="reset" aria-label="تنظیم سرعت پخش به ۱" title="سرعت پخش (کلیک برای بازنشانی به ۱)">۱×</button><button class="spdb spdp" type="button" data-spd="inc" aria-label="افزایش سرعت پخش" title="افزایش سرعت پخش">+</button></span></div>
 <div class="ftt"><button id="aside" class="quiet" type="button" data-ioff="1"></button></div>
</footer>
<div id="scrim" hidden></div>
<aside id="drawer" role="dialog" aria-modal="true" aria-label="منو" aria-hidden="true">
 <div class="dhead"><button id="dback" class="ib" type="button" aria-label="بازگشت" data-ic="chevR" hidden></button><h2 id="dtitle">منو</h2><button id="dclose" class="ib" type="button" aria-label="بستن منو" data-ic="close"></button></div>
 <div class="dbody">
  <nav id="dmenu"></nav>
  <section class="dpanel" id="pScenes" data-title="فهرست صحنه‌ها" hidden></section>
  <section class="dpanel" id="pFilter" data-title="فیلتر و جست‌وجو" hidden></section>
    <section class="dpanel wide" id="spk" data-title="صداها و گوینده‌ها" hidden></section>
  <section class="dpanel wide" id="refs" data-title="رفرنس‌ها" hidden></section>
  <section class="dpanel" id="pVers" data-title="نسخه‌ها و آرشیو" hidden></section>
  <section class="dpanel" id="pUndo" data-title="برگردان آخرین تغییر" hidden></section>
  <section class="dpanel" id="pBatch" data-title="کپی پرامپت‌های دسته" hidden></section>
  <section class="dpanel" id="pInbox" data-title="ورودی‌ها و inbox" hidden></section>
  <section class="dpanel" id="pSettings" data-title="تنظیمات" hidden></section>
  <section class="dpanel" id="pExport" data-title="خروجی برای ادیتور" hidden></section>
  <section class="dpanel" id="pHelp" data-title="راهنما" hidden></section>
 </div>
</aside>
<datalist id="spkl"></datalist><datalist id="voicel"></datalist><datalist id="lbll"></datalist><datalist id="tonel"></datalist>
<div id="toast" role="status" aria-live="polite" hidden></div>
<div id="lb" class="hide" popover="manual"><video controls playsinline class="hide"></video><img alt=""><div></div></div>
<script type="module" src="tools/ui/main.js"></script></body></html>
