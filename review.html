<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>بازبینی و ویرایش</title><link rel="stylesheet" href="tools/ui/review.css"></head><body>
<div id="bar"><h1 id="title">بازبینی</h1>
 <button id="tabR" class="on">بازبینی</button><button id="tabF">رفرنس‌ها</button><button id="tabS">صدا و گوینده‌ها</button>
 <button id="play">▶ پخش</button><button id="prev" aria-label="بلوک قبلی" title="بلوک قبلی">⏮</button><button id="next" aria-label="بلوک بعدی" title="بلوک بعدی">⏭</button>
 <select id="speed"><option value="0.9">۰٫۹×</option><option value="1" selected>۱×</option><option value="1.15">۱٫۱۵×</option><option value="1.3">۱٫۳×</option></select>
 
 <button id="subs" title="ساخت فایل زیرنویس فارسی و انگلیسی (subtitles/fa.srt و en.srt) از روی سناریو؛ زمان‌ها از طول فایل‌های صدا">📝 زیرنویس</button>
 <label title="روشن = متن انگلیسی دیده شود و صدا انگلیسی پخش شود؛ خاموش = فقط فارسی"><input type="checkbox" id="showEN"> English</label>
 <select id="jump" title="پرش به صحنه"></select>
 <select id="filter" title="فیلتر"><option value="all">همه</option><option value="missing">ساخته‌نشده</option><option value="none">بدون علامت</option><option value="ok">✅ تأیید</option><option value="redo">🔁 بازسازی</option><option value="note">دارای یادداشت</option><option value="stale">⚠ کهنه</option></select>
 <span id="info"></span><input id="prog" type="range" min="0" max="0" value="0"></div>
<main id="list"></main><main id="refs" class="hide"></main><main id="spk" class="hide"></main><datalist id="spkl"></datalist><datalist id="voicel"></datalist><datalist id="lbll"></datalist><datalist id="tonel"></datalist><button id="fab" type="button" aria-label="پخش خودکار" title="پخش خودکار: از دیالوگی که روی 🔊 FA یا 🔊 EN اش کلیک کردی به بعد، به همون زبان؛ وگرنه از اول (فارسی، یا انگلیسی اگه تیک English زده شده)"><svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.7 5.2v13.6L18.7 12z"/></svg><svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="5.5" width="3.6" height="13" rx="1"/><rect x="13.4" y="5.5" width="3.6" height="13" rx="1"/></svg></button><div id="lb" class="hide"><video controls playsinline class="hide"></video><img alt=""><div></div></div>
<script type="module" src="tools/ui/main.js"></script></body></html>
